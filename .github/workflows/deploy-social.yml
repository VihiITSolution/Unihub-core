name: Deploy Social Service to Digital Ocean

on:
  push:
    branches:
      - main
    paths:
      - "Unihub-social/**"
      - ".github/workflows/deploy-social.yml"

jobs:
  deploy:
    name: Build and Deploy Social Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Social Service image
        uses: docker/build-push-action@v5
        with:
          context: ./Unihub-social
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unihub-social:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-social:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-social:buildcache,mode=max

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Shared with Unihub-backend so both containers see the same
            # uploaded files (avatars/post images).
            docker volume create unihub-uploads || true

            docker stop unihub-social || true
            docker rm unihub-social || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/unihub-social:latest

            docker run -d \
              --name unihub-social \
              --network unihub-network \
              --restart unless-stopped \
              -p 5001:5001 \
              -v unihub-uploads:/app/uploads \
              -e NODE_ENV=production \
              -e HOST=0.0.0.0 \
              -e PORT=5001 \
              -e UPLOADS_DIR=/app/uploads \
              -e UPLOADS_PUBLIC_BASE_URL=${{ secrets.UPLOADS_PUBLIC_BASE_URL }} \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e ALLOWED_FRONTEND_ORIGINS=${{ secrets.ALLOWED_FRONTEND_ORIGINS }} \
              -e DO_HOST=${{ secrets.DO_HOST }} \
              ${{ secrets.DOCKER_USERNAME }}/unihub-social:latest

            docker image prune -a -f
