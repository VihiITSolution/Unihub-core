name: Deploy Social Service to Digital Ocean

on:
  push:
    branches:
      - main
    paths:
      - "Unihub-social/**"
      - ".github/workflows/deploy-social.yml"

concurrency:
  group: unihub-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Social Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Social Service image
        uses: docker/build-push-action@v5
        with:
          context: ./Unihub-social
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unihub-social:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-social:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-social:buildcache,mode=max

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail

            sudo -n systemctl is-active --quiet nginx
            if [ "$(docker inspect --format='{{.State.Running}}' unihub-nginx 2>/dev/null || echo false)" = "true" ]; then
              echo "Deployment aborted: host Nginx and the legacy Docker Nginx cannot run together"
              exit 1
            fi

            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Shared with Unihub-backend so both containers see the same
            # uploaded files (avatars/post images).
            docker volume create unihub-uploads || true

            # Social uses the backend database and must validate tokens with the
            # same JWT secret. Read those shared values from the running backend
            # container instead of duplicating repository-scoped GitHub secrets.
            if [ "$(docker inspect --format='{{.State.Running}}' unihub-backend 2>/dev/null || echo false)" != "true" ]; then
              echo "Deployment aborted: unihub-backend must be running before Social is deployed"
              exit 1
            fi
            BACKEND_ENV_FILE=$(mktemp)
            SOCIAL_SHARED_ENV_FILE=$(mktemp)
            trap 'rm -f "${BACKEND_ENV_FILE}" "${SOCIAL_SHARED_ENV_FILE}"' EXIT

            docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' unihub-backend > "${BACKEND_ENV_FILE}"
            grep -E '^(DB_HOST|DB_PORT|DB_USER|DB_PASSWORD|DB_NAME|JWT_SECRET)=' "${BACKEND_ENV_FILE}" > "${SOCIAL_SHARED_ENV_FILE}" || true

            for required_variable in DB_HOST DB_USER DB_PASSWORD DB_NAME JWT_SECRET; do
              if ! grep -q "^${required_variable}=." "${SOCIAL_SHARED_ENV_FILE}"; then
                echo "Deployment aborted: unihub-backend does not expose ${required_variable}"
                exit 1
              fi
            done

            BACKEND_CORS_ORIGIN=$(sed -n 's/^CORS_ORIGIN=//p' "${BACKEND_ENV_FILE}" | head -n 1)
            SOCIAL_ALLOWED_ORIGINS="${BACKEND_CORS_ORIGIN:-https://unihub.lk}"

            docker stop unihub-social || true
            docker rm unihub-social || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/unihub-social:latest

            docker run -d \
              --name unihub-social \
              --network unihub-network \
              --restart unless-stopped \
              -p 5001:5001 \
              -v unihub-uploads:/app/uploads \
              --env-file "${SOCIAL_SHARED_ENV_FILE}" \
              -e NODE_ENV=production \
              -e HOST=0.0.0.0 \
              -e PORT=5001 \
              -e UPLOADS_DIR=/app/uploads \
              -e UPLOADS_PUBLIC_BASE_URL=https://unihub.lk \
              -e ALLOWED_FRONTEND_ORIGINS="${SOCIAL_ALLOWED_ORIGINS}" \
              -e DO_HOST=${{ secrets.DO_HOST }} \
              ${{ secrets.DOCKER_USERNAME }}/unihub-social:latest

            for attempt in $(seq 1 40); do
              if [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' unihub-social)" = "healthy" ]; then
                break
              fi
              if [ "${attempt}" -eq 40 ]; then
                echo "Social container did not become healthy"
                docker inspect --format='{{json .State.Health}}' unihub-social || true
                docker logs --tail 150 unihub-social
                exit 1
              fi
              sleep 2
            done

            test -x /usr/local/bin/update-docker-hosts.sh
            sudo -n /usr/local/bin/update-docker-hosts.sh
            sudo -n nginx -t
            sudo -n systemctl reload nginx

            if ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:5001/health >/dev/null; then
              echo "Social service host-port health check failed"
              docker logs --tail 150 unihub-social
              exit 1
            fi

            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 15 --insecure \
                --resolve unihub.lk:443:127.0.0.1 https://unihub.lk/ >/dev/null; then
                break
              fi
              if [ "${attempt}" -eq 15 ]; then
                echo "Origin smoke test failed after Social deployment"
                sudo -n tail -n 100 /var/log/nginx/error.log || true
                exit 1
              fi
              sleep 2
            done

            docker ps --filter name=unihub-social --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

            docker image prune -a -f
